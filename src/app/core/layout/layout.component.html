<div class="l-main">
  <div class="l-main__sidemenu">
    <div class="l-main__toggle">
      <i class="fa-solid fa-bars-staggered"></i>
    </div>
    <nav class="l-main__nav">
      <a *ngFor="let link of navLinks"
        [routerLink]="link.route"
        routerLinkActive="l-main__nav-item--active"
        class="l-main__nav-item"
        (click)="setMainRoute(link.route)">
        <figure>
          <img [src]="routerAssets(link.route)" alt="{{ link.label }}">
        </figure>
      </a>
    </nav>
  </div>
  <div class="l-main__content">
    <div class="l-main__topbar">
      <app-top-bar></app-top-bar>
    </div>
    <div class="d-flex">
      <app-sidebar></app-sidebar>
      <main class="p-4">
        <ng-content></ng-content>
      </main>
    </div>
  </div>
</div>
